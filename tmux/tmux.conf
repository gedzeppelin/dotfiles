set -g default-terminal "tmux-256color"
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

set -sg escape-time 10
set -as terminal-features 'xterm*:extkeys'
set -s set-clipboard on
set -s copy-command "wl-copy --primary"

# Theme
set -g status on
set -g status-position top
set -g status-justify left

set -g mode-style "fg=#15161e,bg=#7aa2f7"
set -g message-style "fg=#7aa2f7,bg=default"
set -g message-command-style "fg=#7aa2f7,bg=default"

set -g status-style "fg=default,bg=default"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g status-left-length "30"
set -g status-right-length "50"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#15161e,bg=#7aa2f7,bold] #{?#{==:#{session_name},0},t,#{session_name}} #[bg=default]"
set -g status-right "#[fg=#7aa2f7]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#3b4261]#h "

setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#16161e"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=default"

setw -g window-status-format "#[fg=#3b4261] #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "

setw -g clock-mode-colour "#7aa2f7"

# Plugins
set -g @emulate-scroll-for-no-mouse-alternate-buffer on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

run '~/.tmux/plugins/tpm/tpm'
